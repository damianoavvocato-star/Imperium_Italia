name: Imperium_Italia Android APK

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "tests/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/imperium-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imperium_italia-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Imperium_Italia debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run Imperium_Italia tests
        run: npm test
      - name: Validate game JavaScript
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('www/index.html','utf8');const a=h.indexOf('<script>');const b=h.indexOf('</script>',a);if(a<0||b<0)throw Error('Script di gioco non trovato');fs.writeFileSync('/tmp/imperium.js',h.slice(a+8,b));"
          node --check /tmp/imperium.js
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android project
        run: npx cap add android
      - name: Sync Android assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Imperium_Italia APK
        uses: actions/upload-artifact@v4
        with:
          name: IMPERIUM-ITALIAE-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
