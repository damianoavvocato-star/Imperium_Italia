name: Imperium Italiae Android APK

on:
  push:
    branches: [main]
    paths:
      - "www/imperium.html"
      - ".github/workflows/imperium-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imperium-italiae-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Imperium Italiae debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run existing repository tests
        run: npm test
      - name: Validate Imperium Italiae JavaScript
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('www/imperium.html','utf8');const a=h.indexOf('<script>');const b=h.indexOf('</script>',a);if(a<0||b<0)process.exit(1);fs.writeFileSync('/tmp/imperium.js',h.slice(a+8,b));"
          node --check /tmp/imperium.js
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare standalone Imperium Italiae app
        run: |
          cp www/imperium.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.imperiumitaliae.game",
            "appName": "Imperium Italiae",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON
      - name: Install Capacitor dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Android assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Imperium Italiae APK
        uses: actions/upload-artifact@v4
        with:
          name: IMPERIUM-ITALIAE-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
